<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>TESTING</title></head>
<body>
<div id="board"></div>
<div id="log"></div>
<div id="banner" class="hidden"></div>
<div id="banner-title"></div>
<button id="btn-end"></button>
<div id="turn-info"></div>
<div id="draft-panel" style="display:none"></div>
<script src="js/rng.js"></script>
<script src="js/range.js"></script>
<script src="js/audioManager.js"></script>
<script src="js/effects.js"></script>
<script src="js/minions.js"></script>
<script src="js/skills.js"></script>
<script src="js/skillAnalyzer.js"></script>
<script src="js/generals.js"></script>
<script src="js/online.js"></script>
<script src="js/game.js"></script>
<script>
const results = [];
function t(name, fn) {
  try { const r = fn(); results.push((r ? 'PASS' : 'FAIL') + ' ' + name); }
  catch (e) { results.push('ERROR ' + name + ': ' + e.message); }
}
// ---- 通用桩 ----
Game.boardEl = document.getElementById('board');
Game._render = function(){};
Game._renderBottom = function(){};
Game._renderMinionPanel = function(){};
Game._renderCastleOverlay = function(){};
Game._refreshUi = function(){};
Game._showFloatText = function(){};
Game._playVictoryVoice = function(){};
Game._maybeAiAct = function(){};   // 测试中不调度 AI
Game.log = function(){};
Game.minionDraftPool = { red: [], blue: [] };
Game.minionPoints = { red: 0, blue: 0 };
Game.minionHand = { red: [], blue: [] };
Game.armedStrategies = { red: [], blue: [] };
Game._limitedUsed = {};
Game.phase = 'battle';
Game.aiMode = false; Game.onlineMode = false; Game.bothAi = false;
Game.castleOwner = {};

function mkPiece(side, x, y, extra) {
  return Object.assign({
    generalId: side + '_' + x + '_' + y + '_' + Math.random().toString(36).slice(2),
    name: side + '兵', side: side, x: x, y: y,
    hp: 100, maxHp: 100, atk: 30, def: 5, alive: true,
    moved: false, attacked: false, skilled: false, cdMap: {},
    moveRange: { shape: '+', n: 3 }, attackRange: { shape: '+', n: 1 },
    skills: []
  }, extra || {});
}

// ========== 1. 获胜规则：只计武将 ==========
t('武将军灭：小兵存活不救命', () => {
  Game.over = false;
  Game.pieces = [
    mkPiece('red', 1, 1),                    // 红方武将（将死）
    mkPiece('red', 2, 2, { isMinion: true }),// 红方小兵
    mkPiece('blue', 9, 9)                    // 蓝方武将
  ];
  Game.pieces[0].alive = false;              // 红方武将阵亡
  Game._checkWin();
  return Game.over === true && document.getElementById('banner-title').textContent.indexOf('蓝方胜利') >= 0;
});

t('武将存活：小兵全灭不判负', () => {
  Game.over = false;
  Game.pieces = [
    mkPiece('red', 1, 1),                    // 红方武将存活
    mkPiece('red', 2, 2, { isMinion: true, alive: false }),
    mkPiece('red', 3, 3, { isBuilding: true, isMinion: true, alive: false }),
    mkPiece('blue', 9, 9)
  ];
  Game._checkWin();
  return Game.over === false;
});

t('双方武将同灭+中立存活 → 中立胜利', () => {
  Game.over = false;
  Game.pieces = [
    mkPiece('red', 1, 1, { alive: false }),
    mkPiece('blue', 9, 9, { alive: false }),
    mkPiece('neutral', 5, 5, { isMinion: true })
  ];
  Game._checkWin();
  return Game.over === true && document.getElementById('banner-title').textContent.indexOf('中立势力胜利') >= 0;
});

t('双方武将同灭+无中立 → 平局', () => {
  Game.over = false;
  Game.pieces = [
    mkPiece('red', 1, 1, { alive: false }),
    mkPiece('blue', 9, 9, { alive: false })
  ];
  Game._checkWin();
  return Game.over === true && document.getElementById('banner-title').textContent.indexOf('平局') >= 0;
});

// ========== 2. 建筑位移免疫 ==========
t('push 建筑默认免疫', () => {
  const b = mkPiece('red', 4, 4, { isBuilding: true, isMinion: true });
  Game.pieces = [b];
  Effect.push(null, b, [1, 0], 2);
  return b.x === 4 && b.y === 4;
});
t('push 建筑加开关可推动', () => {
  const b = mkPiece('red', 4, 4, { isBuilding: true, isMinion: true });
  Game.pieces = [b];
  Effect.push(null, b, [1, 0], 2, { affectBuilding: true });
  return b.x === 6 && b.y === 4;
});
t('pull 建筑默认免疫', () => {
  const a = mkPiece('blue', 6, 4);
  const b = mkPiece('red', 4, 4, { isBuilding: true, isMinion: true });
  Game.pieces = [a, b];
  const moved = Effect.pull(a, b, 2);
  return moved === 0 && b.x === 4;
});
t('pull 建筑加开关可拉动', () => {
  const a = mkPiece('blue', 6, 4);
  const b = mkPiece('red', 4, 4, { isBuilding: true, isMinion: true });
  Game.pieces = [a, b];
  const moved = Effect.pull(a, b, 2, { affectBuilding: true });
  return moved === 1 && b.x === 5;
});
t('teleport 建筑默认免疫', () => {
  const b = mkPiece('red', 4, 4, { isBuilding: true, isMinion: true });
  Game.pieces = [b];
  const r = Effect.teleport(b, 8, 8);
  return r === false && b.x === 4 && b.y === 4;
});
t('teleport 建筑加开关可传送', () => {
  const b = mkPiece('red', 4, 4, { isBuilding: true, isMinion: true });
  Game.pieces = [b];
  const r = Effect.teleport(b, 8, 8, { affectBuilding: true });
  return r === true && b.x === 8 && b.y === 8;
});
t('swap 建筑默认免疫', () => {
  const a = mkPiece('blue', 1, 1);
  const b = mkPiece('red', 4, 4, { isBuilding: true, isMinion: true });
  Game.pieces = [a, b];
  const r = Effect.swap(a, b);
  return r === false && a.x === 1 && b.x === 4;
});
t('swap 建筑加开关可换位', () => {
  const a = mkPiece('blue', 1, 1);
  const b = mkPiece('red', 4, 4, { isBuilding: true, isMinion: true });
  Game.pieces = [a, b];
  const r = Effect.swap(a, b, { affectBuilding: true });
  return r === true && a.x === 4 && b.x === 1;
});
t('普通棋子不受免疫影响', () => {
  const p = mkPiece('red', 4, 4);
  Game.pieces = [p];
  Effect.push(null, p, [1, 0], 2);
  return p.x === 6;
});

// ========== 3. 城池占领：建筑/中立不占城 ==========
t('建筑站上城池不占领', () => {
  Game.castleOwner = {};
  const b = mkPiece('red', 0, 0, { isBuilding: true, isMinion: true });
  Game.pieces = [b];
  Game._captureCastle(b);
  return Game.castleOwner['0,0'] !== 'red';
});
t('中立势力站上城池不占领', () => {
  Game.castleOwner = {};
  const n = mkPiece('neutral', 0, 0, { isMinion: true });
  Game.pieces = [n];
  Game._captureCastle(n);
  Game._refreshCastleOwnership();
  return !Game.castleOwner['0,0'];
});
t('红方武将站上城池正常占领', () => {
  Game.castleOwner = {};
  const g = mkPiece('red', 0, 0);
  Game.pieces = [g];
  Game._captureCastle(g);
  return Game.castleOwner['0,0'] === 'red';
});

// ========== 4. 中立回合轮换 ==========
t('有中立单位：蓝→中立→红', () => {
  Game.over = false; Game.turn = 1;
  Game.pieces = [mkPiece('red', 1, 1), mkPiece('blue', 9, 9), mkPiece('neutral', 5, 6, { isMinion: true })];
  Game.currentSide = 'blue';
  Game.endTurn();
  if (Game.currentSide !== 'neutral') return false;
  Game.endTurn();
  return Game.currentSide === 'red' && Game.turn === 2;
});
t('无中立单位：蓝→红（跳过中立）', () => {
  Game.over = false; Game.turn = 1;
  Game.pieces = [mkPiece('red', 1, 1), mkPiece('blue', 9, 9)];
  Game.currentSide = 'blue';
  Game.endTurn();
  return Game.currentSide === 'red' && Game.turn === 2;
});

// ========== 5. 召唤 API 支持中立阵营 ==========
t('summonUnit opts.side=neutral', () => {
  const a = mkPiece('red', 2, 2);
  Game.pieces = [a];
  const u = Effect.summonUnit(a, 3, 3, { name: '乱军', hp: 50, atk: 10, side: 'neutral' });
  return u && u.side === 'neutral' && Game.pieces.indexOf(u) >= 0;
});
t('summonUnit 默认继承 actor 阵营', () => {
  const a = mkPiece('red', 2, 2);
  Game.pieces = [a];
  const u = Effect.summonUnit(a, 3, 3, { name: '召唤物', hp: 50, atk: 10 });
  return u && u.side === 'red';
});

document.title = results.join(' | ');
</script>
</body>
</html>
